<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>끌림 — 놀아보기</title>
<meta name="description" content="《끌림 / Drawn》 브라우저 프로토타입 — 2000년대 초 하굣길. 학교 운동장에서 문방구까지, 웅덩이·상자·백 원짜리.">
<link rel="icon" href="../img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--paper:#FAFAF7;--paper2:#F1F1EC;--ink:#111;--g1:#3A3A38;--g2:#7C7C78;--g3:#C9C9C4;--line:#DADAD5;--red:#E8562D;--coat:#F2C94C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper2);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:980px;margin:0 auto;padding:18px 18px 60px}
  nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px;border-bottom:3px solid var(--ink);margin-bottom:14px}
  nav .logo{font-family:"Gaegu",cursive;font-weight:700;font-size:28px;text-decoration:none;color:var(--ink);line-height:1}
  nav .links a{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--g1);padding:6px 10px;border:2px solid transparent;border-radius:14px}
  nav .links a:hover{border-color:var(--ink)}
  .frame{border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:8px 8px 0 #111;overflow:hidden;position:relative}
  canvas{display:block;width:100%;height:auto;touch-action:none;background:#FAFAF7}
  .bar{display:flex;gap:14px;align-items:center;padding:10px 14px;border-top:3px solid var(--ink);background:var(--paper);flex-wrap:wrap}
  .bar b{font-family:"Gaegu",cursive;font-weight:700;font-size:21px}
  .bar .m{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2)}
  .bar .meter{width:120px;height:12px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;background:#fff}
  .bar .meter i{display:block;height:100%;background:var(--red);width:0}
  .bar .meter.blue i{background:#CBA83C}
  .bar .chip{font-family:"Gaegu",cursive;font-weight:700;font-size:17px;border:2px solid var(--ink);border-radius:12px;padding:2px 10px;background:#fff}
  .help{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--g2);margin:10px 0 0}
  .note{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 16px;font-family:"Gaegu",cursive;font-weight:700;font-size:20px;box-shadow:4px 4px 0 #111;white-space:nowrap;max-width:92%;pointer-events:none;opacity:0;transition:opacity .25s}
  .note small{display:block;font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:12.5px;color:var(--g1);text-align:center}
  .note.on{opacity:1}
  .end{position:absolute;inset:0;background:rgba(250,250,247,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .end.on{display:flex}
  .end h3{font-family:"Gaegu",cursive;font-weight:700;font-size:34px;margin:0}
  .end p{margin:0;color:var(--g1)}
  .btn{font-family:"Gaegu",cursive;font-weight:700;font-size:21px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:24px;padding:8px 20px;cursor:pointer;box-shadow:4px 4px 0 #888;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="logo" href="../">끌림</a><div class="links"><a href="../">소개</a><a href="../design/">기획서</a></div></nav>
  <div class="frame">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="note" id="note"></div>
    <div class="end" id="end"><h3 id="endTitle">문방구 도착. 비가 그친다.</h3><p id="endBody"></p><button class="btn" id="again">한 번 더</button></div>
    <div class="bar">
      <b id="mission" class="chip">•</b>
      <span class="m">마음</span><span class="meter"><i id="bond"></i></span>
      <span class="m">백원</span><span class="meter blue"><i id="drops"></i></span><b id="dropsN">0/12</b>
      <span class="m">목적지</span><b id="dist">0m</b>
    </div>
  </div>
  <p class="help">WASD/방향키 — 지우 · 스페이스 — 점프 · Shift — 강아지 부르기 · 터치: 왼쪽을 끌면 걷고, 오른쪽을 톡 치면 점프, 꾹 누르면 부르기</p>
</div>
<script>
(() => {
// ── 세계: 앱과 같은 지도 (2m 타일)
const MAP = [
"########################################",
"#......................................#",
"#..####...####...####...####...####....#",
"#..####...####...####...####...####....#",
"#gggggggggggggggggggggggggggggggggggg..#",
"#gggggggggggggggggggggggggggggggggggg..#",
"#ggggggSgggggggggggggggggggggggggggggw.#",
"#......................................#",
"======+==================+==============",
"======+==================+==============",
"#....w.........o..........w............#",
"#..####..#####..###..#####..####..###..#",
"#..####..#####..###..#####..####..###..#",
"#........w.......o......w.....D....o...#",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~"];
const T = 2, PPM = 40, COLS = MAP[0].length, ROWS = MAP.length, W = COLS * T, H = ROWS * T;
const SHOPS = [["태극 오락실","#C0392B"],["영도 만화방","#6D5AA8"],["비디오 대여점","#3F5F8F"],["이모네 떡볶이","#E0562D"],["봉래 세탁소","#4A7BC0"],["자갈치 어묵","#E0973A"],["남항 방앗간","#C8763C"],["신신 이발관","#2F6F9F"],["영도 사진관","#4E6E8E"],["대성 철물점","#3A8F5C"]];
const MISSIONS = [
  {t:"심부름 · 백 원 여덟 개", b:"엄마가 두부 사 오래. 백 원짜리 좀 모아 보자.", n:8, kind:"coins"},
  {t:"심부름 · 나란히 첨벙 세 번", b:"오늘은 젖어도 돼. 같이 첨벙해 보자.", n:3, kind:"together"},
  {t:"심부름 · 열두 번 뛰기", b:"웅덩이 보이면 다 뛰어넘기. 열두 번!", n:12, kind:"jumps"},
  {t:"심부름 · 백 원 다 줍기", b:"오늘은 뽑기 하는 날. 열두 개 다 줍자!", n:12, kind:"coins"}
];
const cell = (c, r) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? '#' : MAP[r][c];
const at = (x, y) => cell(Math.floor(x / T), Math.floor(y / T));
const blocked = ch => ch === '#' || ch === '~', road = ch => ch === '=' || ch === '+';
const lowAt = (x, y) => { const c = Math.floor(x / T), r = Math.floor(y / T); if (cell(c, r) !== 'o') return false; const hz = !blocked(cell(c - 1, r)) && cell(c - 1, r) !== '=' || !blocked(cell(c + 1, r)); const cx = c * T + 1, cy = r * T + 1; return hz ? Math.abs(x - cx) < .3 : Math.abs(y - cy) < .3; };
const clear = (x, y, r, air) => { for (const [dx, dy] of [[r,0],[-r,0],[0,r],[0,-r],[r*.7,r*.7],[-r*.7,r*.7],[r*.7,-r*.7],[-r*.7,-r*.7]]) { if (blocked(at(x + dx, y + dy)) || (!air && lowAt(x + dx, y + dy))) return false; } return true; };
const slide = (b, nx, ny, r) => { const air = b.z > .1; if (clear(nx, b.y, r, air)) b.x = nx; if (clear(b.x, ny, r, air)) b.y = ny; };
const find = ch => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (MAP[r][c] === ch) return [c * T + 1, r * T + 1]; };
const crosswalkCols = [...new Set(MAP.flatMap(row => [...row].map((ch, i) => ch === '+' ? i : -1).filter(i => i >= 0)))];
const cwX = crosswalkCols.map(c => c * T + 1);
const lanes = MAP.map((row, r) => row.includes('=') ? r : -1).filter(r => r >= 0);

// 건물 줄 → 가게
const buildings = []; let k = 0;
for (let r = 0; r < ROWS; r++) { let c = 0; while (c < COLS) { if (MAP[r][c] !== '#') { c++; continue; } let run = 1; while (c + run < COLS && MAP[r][c + run] === '#') run++; const south = cell(c, r + 1) !== '#'; const border = r === 0 || r === ROWS - 1 || c === 0 || c + run === COLS; let shop = null; if (south && !border) { shop = SHOPS[k % SHOPS.length]; k++; const d = find('D'); if (Math.floor(d[1] / T) === r + 1 && Math.floor(d[0] / T) >= c && Math.floor(d[0] / T) < c + run) shop = ["영도 문방구", "#2E8B57"]; } buildings.push({ c, r, run, south, shop, v: (r * 7 + c * 3) % 5 }); c += run; } }

// ── 상태
const S = {};
function reset() {
  const s = find('S'), d = find('D');
  S.girl = { x: s[0] + .3, y: s[1], vx: 0, vy: 0, z: 0, vz: 0, air: false, fx: 1, ax: 0, ay: 0 };
  S.dog = { x: s[0] - .5, y: s[1] + .3, vx: 0, vy: 0, z: 0, vz: 0, air: false, fx: 1, ax: 0, ay: 0 };
  S.dest = d; S.trail = [[S.girl.x, S.girl.y]]; S.marks = []; S.bond = .18; S.bloom = 0; S.time = 0; S.stun = 0; S.safe = [S.girl.x, S.girl.y];
  S.cars = []; S.cycle = Math.random() * 19; S.spawn = 1; S.busT = 12; S.done = false;
  S.sniff = 0; S.target = null; S.girlLand = -9; S.dogLand = -9; S.girlSplash = false; S.dogSplash = false; S.wasRoad = false; S.enterY = 0; S.crossed = false;
  S.jumps = 0; S.splashes = 0; S.together = 0; S.fx = []; S.bubble = null; S.log = [];
  S.mission = MISSIONS[(parseInt(localStorage.getItem('drawn.walks') || '0', 10)) % MISSIONS.length]; S.missionDone = false;
  // 냄새·색 방울·행인
  const free = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (MAP[r][c] === '.' || MAP[r][c] === 'g') { const x = c * T + 1, y = r * T + 1; if (Math.hypot(x - s[0], y - s[1]) > 4 && Math.hypot(x - d[0], y - d[1]) > 3) free.push([x, y]); }
  free.sort(() => Math.random() - .5);
  const puddles = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (MAP[r][c] === 'w') puddles.push([c * T + 1, r * T + 1]);
  const near = p => Math.min(...puddles.map(q => Math.hypot(q[0] - p[0], q[1] - p[1])));
  S.spots = free.slice(0, 10).map(p => ({ x: p[0] + (Math.random() - .5), y: p[1] + (Math.random() - .5), kind: ['군고구마', '붕어빵', '뽑기 기계', '오락기', '우체통', '평상', '고양이', '전봇대'][Math.floor(Math.random() * 8)], used: false }));
  const rest = free.slice(10).sort((a, b) => near(a) - near(b));
  S.drops = rest.slice(0, 12).map((p, i) => ({ x: p[0] + (Math.random() - .5), y: p[1] + (Math.random() - .5), hue: i / 12, taken: false, ph: Math.random() * 6 }));
  S.npcs = [[1, 3, 37, 'h'], [4, 3, 37, 's'], [7, 3, 37, 'h'], [10, 3, 37, 's']].map(([r, c0, c1, kind], i) => ({ x: c0 * T + Math.random() * (c1 - c0) * T, y: r * T + 1 + (i % 2 ? .4 : -.4), dir: Math.random() < .5 ? 1 : -1, sp: kind === 'h' ? .7 : 1.15, x0: c0 * T + .6, x1: c1 * T - .6, kind, ph: 0 }));
  note('우비 입었다. 비 냄새. 가방 멘 지우 냄새.', S.mission.b);
}

// ── 입력
const keys = new Set(); let jumpReq = false, callHeld = false;
addEventListener('keydown', e => { if (e.code === 'Space') { if (!keys.has('Space')) jumpReq = true; e.preventDefault(); } keys.add(e.code); });
addEventListener('keyup', e => keys.delete(e.code));
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let touch = { move: [0, 0], id: null, sx: 0, sy: 0, right: null, rightT: 0 };
cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width; if (x < .5 && touch.id === null) { touch.id = e.pointerId; touch.sx = e.clientX; touch.sy = e.clientY; } else if (x >= .5) { touch.right = e.pointerId; touch.rightT = performance.now(); } });
cv.addEventListener('pointermove', e => { if (e.pointerId === touch.id) { const dx = (e.clientX - touch.sx) / 40, dy = (e.clientY - touch.sy) / 40; const l = Math.hypot(dx, dy) || 1; const m = Math.min(1, l); touch.move = [dx / l * m, dy / l * m]; } });
const up = e => { if (e.pointerId === touch.id) { touch.id = null; touch.move = [0, 0]; } if (e.pointerId === touch.right) { if (performance.now() - touch.rightT < 260) jumpReq = true; touch.right = null; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// ── 시뮬레이션 (앱의 WalkSim v4를 따른다)
const GSP = 2.1, DSP = 2.6, JV = 4.8, G = 15;
function trailPoint(back) { let rem = back, p = [S.girl.x, S.girl.y]; for (let i = S.trail.length - 1; i >= 0; i--) { const q = S.trail[i], sx = p[0] - q[0], sy = p[1] - q[1], L = Math.hypot(sx, sy); if (L >= rem) { const d = L > .001 ? [sx / L, sy / L] : [S.girl.fx, 0]; return [p[0] - d[0] * rem, p[1] - d[1] * rem, d[0], d[1]]; } rem -= L; p = q; } return [p[0], p[1], S.girl.fx, 0]; }
function integrate(b, dt, r) { slide(b, b.x + b.vx * dt, b.y + b.vy * dt, r); if (!b.air) return false; b.vz -= G * dt; b.z += b.vz * dt; if (b.z > 0) return false; b.z = 0; b.vz = 0; b.air = false; if (!clear(b.x, b.y, r, false)) { const dx = b.x - b.ax, dy = b.y - b.ay, L = Math.hypot(dx, dy) || 1; let ok = false; for (let f = .05; f <= .9; f += .05) { const px = b.x + dx / L * f, py = b.y + dy / L * f; if (clear(px, py, r, false)) { b.x = px; b.y = py; ok = true; break; } } if (!ok) for (let t = .95; t >= 0; t -= .05) { const px = b.ax + dx * t, py = b.ay + dy * t; if (clear(px, py, r, false)) { b.x = px; b.y = py; break; } } } return true; }
function takeOff(b, s) { b.air = true; b.vz = JV * s; b.ax = b.x; b.ay = b.y; }
function step(dt) {
  if (S.done) return;
  S.time += dt; S.bloom = Math.max(0, S.bloom - dt * .8); S.stun = Math.max(0, S.stun - dt);
  let mx = 0, my = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1; if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my -= 1; if (keys.has('KeyS') || keys.has('ArrowDown')) my += 1;
  const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; }
  if (touch.move[0] || touch.move[1]) { mx = touch.move[0]; my = touch.move[1]; }
  const call = keys.has('ShiftLeft') || keys.has('ShiftRight') || (touch.right !== null && performance.now() - touch.rightT > 260);
  const g = S.girl, d = S.dog; let dB = 0;
  // 지우
  let wx = S.stun > 0 ? 0 : mx * GSP, wy = S.stun > 0 ? 0 : my * GSP;
  if (!g.air && at(g.x, g.y) === 'w') { wx *= .65; wy *= .65; }
  const kg = Math.min(1, dt * (g.air ? 2.5 : 10)); g.vx += (wx - g.vx) * kg; g.vy += (wy - g.vy) * kg;
  if (jumpReq && !g.air && S.stun <= 0) { takeOff(g, 1); S.marks.push([g.x, g.y]); if (S.marks.length > 8) S.marks.shift(); S.jumps++; }
  jumpReq = false;
  if (integrate(g, dt, .24)) { const sp = at(g.x, g.y) === 'w'; const tog = sp && S.dogSplash && S.time - S.dogLand < 1.5; S.girlLand = S.time; S.girlSplash = sp; if (sp) { S.splashes++; dB += tog ? .05 : .015; S.bloom = Math.max(S.bloom, tog ? 1 : .45); splash(g.x, g.y, tog); if (tog) { S.together++; note('첨벙!! 지우도 첨벙! 색이 튄다.', '봤어? 무지개색!'); bubble('♥', '#E8562D'); } } }
  face(g, dt);
  const last = S.trail[S.trail.length - 1]; if (Math.hypot(g.x - last[0], g.y - last[1]) > .12) { S.trail.push([g.x, g.y]); if (S.trail.length > 80) S.trail.shift(); }
  if (!g.air && !road(at(g.x, g.y)) && !blocked(at(g.x, g.y)) && !lowAt(g.x, g.y)) S.safe = [g.x, g.y];
  // 강아지
  let dwx = 0, dwy = 0; const gap = Math.hypot(g.x - d.x, g.y - d.y);
  if (S.sniff > 0 && !call) { S.sniff -= dt; if (S.sniff <= 0 && S.target) { S.target.used = true; S.target = null; } }
  else {
    if (S.sniff > 0) { S.sniff = 0; if (S.target) S.target.used = true; S.target = null; dB += .02; note('지우가 부른다. 간다!', '옳지.'); bubble('♪', '#E8962D'); }
    const tp = trailPoint(.8); let gx = tp[0] + tp[3] * .3, gy = tp[1] - tp[2] * .3; let sp = DSP;
    if (call) { gx = g.x - g.fx * .5; gy = g.y; sp *= 1.3; }
    const tx = gx - d.x, ty = gy - d.y, gd = Math.hypot(tx, ty); if (gd > .15) { const v = Math.min(sp, gd * 4); dwx = tx / gd * v; dwy = ty / gd * v; }
    if (!call && !d.air) {
      if (!S.target || S.target.used) { let best = null, bd = 1.8; for (const s of S.spots) if (!s.used) { const dd = Math.hypot(s.x - d.x, s.y - d.y); if (dd < bd) { bd = dd; best = s; } } S.target = best; }
      if (S.target) { const ddx = S.target.x - d.x, ddy = S.target.y - d.y, dist = Math.hypot(ddx, ddy); if (dist > .05 && gap < 3) { dwx += ddx / dist * .6; dwy += ddy / dist * .6; } if (dist < .4) { S.sniff = 1.6 + Math.random(); note('잠깐… ' + S.target.kind + ' 냄새…', '보리, 가자~'); bubble('?', '#3A7BC8'); } }
    }
    if (!d.air) { const i = S.marks.findIndex(m => Math.hypot(m[0] - d.x, m[1] - d.y) < .45); if (i >= 0) { S.marks.splice(i, 1); takeOff(d, .95); } }
  }
  const kd = Math.min(1, dt * (d.air ? 2.5 : 9)); d.vx += (dwx - d.vx) * kd; d.vy += (dwy - d.vy) * kd;
  if (integrate(d, dt, .2)) { const sp = at(d.x, d.y) === 'w'; const tog = sp && S.girlSplash && S.time - S.girlLand < 1.5; S.dogLand = S.time; S.dogSplash = sp; if (sp) { S.splashes++; dB += tog ? .05 : .015; S.bloom = Math.max(S.bloom, tog ? 1 : .4); splash(d.x, d.y, tog); if (tog) { S.together++; note('첨벙!! 나란히 첨벙!', '봤어? 무지개색!'); bubble('♥', '#E8562D'); } } }
  face(d, dt);
  if (gap > 7) { S.far = (S.far || 0) + dt; if (S.far > 4) { const tp = trailPoint(1.5); d.x = tp[0]; d.y = tp[1]; d.vx = d.vy = 0; S.far = 0; } } else S.far = 0;
  // 색 방울
  for (const dr of S.drops) if (!dr.taken && (Math.hypot(dr.x - g.x, dr.y - g.y) < .5 || Math.hypot(dr.x - d.x, dr.y - d.y) < .45)) { dr.taken = true; dB += .035; S.bloom = Math.max(S.bloom, .6); sparkle(dr.x, dr.y); const n = S.drops.filter(x => x.taken).length; if (n === 1) note('백 원! 빗물에 씻겨 반짝인다.', '우와, 백 원. 이거 뽑기 한 번이야.'); else if (n === 12) note('천이백 원. 오늘 우리 부자다.', '열두 개! 뽑기랑 오락 다 되겠다.'); bubble('♥', '#E8562D'); }
  // 차

  if (!S.missionDone && mv >= S.mission.n) { S.missionDone = true; note('심부름 끝!', '이제 문방구 가자.'); }
  document.getElementById('mission').textContent = (S.missionDone ? '✓ ' : '• ') + S.mission.t + '  ' + Math.min(mv, S.mission.n) + '/' + S.mission.n;
  document.getElementById('mission').style.background = S.missionDone ? '#F2E29E' : '#fff';
  document.getElementById('bond').style.width = Math.round(S.bond * 100) + '%';
  const n = S.drops.filter(x => x.taken).length; document.getElementById('drops').style.width = Math.round(n / 12 * 100) + '%'; document.getElementById('dropsN').textContent = n + '/12';
  document.getElementById('dist').textContent = Math.round(Math.hypot(g.x - S.dest[0], g.y - S.dest[1])) + 'm';
  if (performance.now() > noteT) document.getElementById('note').classList.remove('on');
  if (!window.__drawnManual) requestAnimationFrame(frame);
}
reset(); requestAnimationFrame(frame);
window.__drawn = { S, keys, frame };
})();
</script>
